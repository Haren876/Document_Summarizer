<!DOCTYPE html>

<html>

<head>

    <title>Document AI Summarizer</title>

    <style>

        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        .upload {
            border: 2px dashed #888;
            padding: 40px;
            text-align: center;
            margin-top: 30px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            cursor: pointer;
        }

        #loading {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        #result {
            margin-top: 30px;
            line-height: 1.7;
        }

        pre {
            white-space: pre-wrap;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>
        📄 Document AI Summarizer
    </h1>

    <p>
        Upload a PDF and generate
        a detailed AI summary.
    </p>


    <div class="upload">

        <input
            type="file"
            id="fileInput"
            accept=".pdf"
        >

        <br>

        <button
            onclick="generateSummary()"
        >
            Generate Detailed Summary
        </button>

    </div>


    <div id="loading">

        ⏳ Analyzing document...

    </div>


    <div id="result"></div>


</div>


<script>


async function generateSummary() {


    const fileInput =
        document.getElementById(
            "fileInput"
        );


    const result =
        document.getElementById(
            "result"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    if (!fileInput.files.length) {

        alert(
            "Please select a PDF."
        );

        return;

    }


    const file =
        fileInput.files[0];


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    loading.style.display =
        "block";


    result.innerHTML = "";


    try {


        const response =
            await fetch(

                "http://127.0.0.1:8000/summarize",

                {
                    method: "POST",
                    body: formData
                }

            );


        const data =
            await response.json();


        if (!data.success) {

            result.innerHTML =
                `<p>
                    Error: ${data.error}
                </p>`;

            return;

        }


        result.innerHTML = `

            <h2>
                ${data.filename}
            </h2>

            <p>
                Pages:
                ${data.pages}
            </p>

            <p>
                Chunks:
                ${data.chunks}
            </p>

            <hr>

            <h2>
                Detailed Summary
            </h2>

            <pre>
${data.summary}
            </pre>

        `;


    }


    catch (error) {

        result.innerHTML = `

            <p>

                Cannot connect to backend.

                Make sure the backend is running.

            </p>

        `;

        console.error(error);

    }


    finally {

        loading.style.display =
            "none";

    }

}


</script>


</body>

</html>
